name: Python tests (sales forecast, RAG, agent, MCP server)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/**.py"
      - "tests/**"
      - "data/process/rag.py"
      - "data/pipelines/rag.py"
      - "docs/company-knowledge-base/**"
      - "services/agent/**"
      - "mcps/**"
      - "packages/shared/incidents/**"
      - "data/eval/agent-eval-cases.json"
      - "data/eval/agent_eval_traces.json"
      - "data/raw/healthcore_sales.csv"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Temporal CV, forecast and RAG tests (Qdrant and the LLM are stubbed)
        run: uv run python -m pytest tests/pipelines/test_temporal_cv.py tests/pipelines/test_sales_forecast.py tests/pipelines/test_rag.py -v
      - name: LangGraph agent tests and evals (evals read the recorded traces)
        run: uv run python -m pytest tests/pipelines/test_agent_graph.py tests/pipelines/test_agent_tools.py tests/pipelines/test_agent_evals.py -v
      - name: HealthCore MCP server (real server, test OAuth server, stand-in API)
        run: uv run python -m pytest tests/mcps -v
