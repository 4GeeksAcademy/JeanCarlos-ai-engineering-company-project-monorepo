[project]
name = "healthcore-monorepo"
version = "0.1.0"
description = "HealthCore monorepo Python environment: API, data pipelines, sales forecast and RAG knowledge base."
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "fastmcp>=3.4.11,<4",
    "flower>=2,<3",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "libpass[bcrypt]>=1,<2",
    "markitdown[pdf]>=0.1.9",
    "matplotlib>=3.11.2",
    "mcp>=1.24,<2",
    "mcpauth==0.2.0b1",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "pandas>=2.2,<3",
    "prefect>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "py-readability-metrics>=1.4.5",
    "pydantic[email]>=2.10,<3",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "qdrant-client>=1.20.0",
    "resend>=2,<3",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.22,<1",
    "tinydb>=4.8,<5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.2.0",
    "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
