# Repository-root entry point for the API test suite:
#   uv run pytest          # 194 tests (services/api/tests)
#   uv run pytest --cov    # with coverage of services/api
# Runtime dependencies come from services/api/requirements.txt (single source),
# test tools from the "dev" dependency group. services/api/pyproject.toml keeps
# working for `cd services/api && uv run pytest`.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcore-api"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
seed = "services.api.seed:main"

[tool.setuptools.dynamic]
dependencies = { file = ["services/api/requirements.txt"] }

[tool.setuptools.packages.find]
include = ["services.api*"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
# The repository root goes on sys.path so tests import the API as `services.api`.
testpaths = ["services/api/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["services/api"]
omit = [
    "services/api/tests/*",
    "services/api/.venv/*",
    "services/api/seed*.py",
    "services/api/bootstrap_admin.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
