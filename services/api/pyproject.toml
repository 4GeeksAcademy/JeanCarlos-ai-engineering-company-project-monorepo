[project]
name = "healthcore-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "libpass[bcrypt]>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic[email]>=2.10,<3",
    "python-dotenv>=1,<2",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.9,<1",
    "resend>=2,<3",
    "sqlmodel>=0.0.22,<1",
    "tinydb>=4.8,<5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
# Run from services/api: `uv run pytest`. The repository root goes on sys.path
# so the tests can import the API package as `services.api`.
pythonpath = ["../.."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "seed*.py", "bootstrap_admin.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
