services:
  ui:
    build:
      context: ./uis
    init: true
    environment:
      SUPPLIERS_API_URL: http://api:8000
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-/api/telemetry/events}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://api:8000/telemetry/events}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://playground.4geeks.com/tracker/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uis/talent-pipeline-tracker:/app/talent-pipeline-tracker
      - tracker_node_modules:/app/talent-pipeline-tracker/node_modules
      - tracker_next:/app/talent-pipeline-tracker/.next
      - ./uis/backoffice:/app/backoffice
      - backoffice_node_modules:/app/backoffice/node_modules
      - backoffice_next:/app/backoffice/.next
    depends_on:
      - api
    networks:
      - healthcore

  api:
    build:
      context: ./services
    init: true
    # Development defaults (versioned, no secrets) first; an optional .env overrides
    # them. JWT_SECRET_KEY is generated by the entrypoint when it is not provided.
    env_file:
      - path: compose.dev.env
        required: true
      - path: ${COMPOSE_ENV_FILE:-.env}
        required: false
    environment:
      SUPPLIERS_DB_PATH: /data/suppliers.json
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://api:8000/telemetry/events}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./services/api:/app/services/api
      - api_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthcore

  # Local PostgreSQL for the inventory (only on the internal network, no host port).
  # Point DATABASE_URL in .env to an external database (e.g. Supabase) to replace it.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcore-dev}
      POSTGRES_DB: healthcore
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcore -d healthcore"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - healthcore

networks:
  healthcore:
    driver: bridge

volumes:
  tracker_node_modules:
  tracker_next:
  backoffice_node_modules:
  backoffice_next:
  api_data:
  db_data:
