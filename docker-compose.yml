services:
  ui:
    build:
      context: ./uis
    init: true
    environment:
      SUPPLIERS_API_URL: http://api:8000
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-/api/telemetry/events}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://api:8000/telemetry/events}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://playground.4geeks.com/tracker/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uis/talent-pipeline-tracker:/app/talent-pipeline-tracker
      - tracker_node_modules:/app/talent-pipeline-tracker/node_modules
      - tracker_next:/app/talent-pipeline-tracker/.next
      - ./uis/backoffice:/app/backoffice
      - backoffice_node_modules:/app/backoffice/node_modules
      - backoffice_next:/app/backoffice/.next
    depends_on:
      - api
    networks:
      - healthcore

  api:
    build:
      context: ./services
      additional_contexts:
        pipelines: ./data
        shared: ./packages/shared
        scripts: ./scripts
    init: true
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      SUPPLIERS_DB_PATH: /data/suppliers.json
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://api:8000/telemetry/events}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # LangGraph checkpoints and traces (SQLite) on the persistent api_data volume.
      AGENT_STATE_DIR: /data/agent
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./services/api:/app/services/api
      - ./services/telemetry:/app/services/telemetry
      - ./services/reporting:/app/services/reporting
      - ./services/agent:/app/services/agent
      - ./data:/app/data
      # RAG corpus, so `docker compose exec api python -m data.process.rag` can re-index it.
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - ./packages/shared/incidents:/app/packages/shared/incidents
      - ./scripts:/app/scripts:ro
      - api_data:/data
    networks:
      - healthcore

  # OAuth 2.1 / OIDC authorization server of the HealthCore MCP server (mcps/healthcore_mcp).
  # Realm `healthcore` (scopes incidents:read, incidents:write, inventory:read and one client per
  # permission level) is imported from the repository; client secrets and the admin password come
  # from the gitignored env file created by mcps/healthcore_mcp/scripts/init_dev_secrets.py.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    env_file:
      - path: ${MCP_ENV_FILE:-./mcps/healthcore_mcp/.env}
        required: true
    environment:
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./mcps/healthcore_mcp/keycloak/healthcore-realm.json:/opt/keycloak/data/import/healthcore-realm.json:ro
    networks:
      - healthcore

  # Ticket DEV-55: broker and result backend of the Celery task queue.
  redis:
    image: redis:7.4-alpine
    # appendonly: queued messages survive a Redis restart. noeviction: Redis never drops
    # keys (messages, results) under memory pressure; it rejects writes instead.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - healthcore

  # Vector database for the RAG knowledge base (collection healthcore_knowledge).
  # Filled by `python -m data.process.rag` (setup()); the volume keeps it across restarts.
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - healthcore

  # Celery worker: separate process and container from the API. Stopping the API does
  # not stop it, and queued messages wait in Redis. A warm shutdown (SIGTERM) lets the
  # running task finish within stop_grace_period; unacked messages return to the queue.
  worker:
    build:
      context: ./services
      additional_contexts:
        pipelines: ./data
    command: ["celery", "-A", "services.celery_app", "worker", "-Q", "reporting", "--concurrency", "2", "--loglevel", "INFO", "-n", "reporting@%h"]
    init: true
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 120s
    restart: unless-stopped
    networks:
      - healthcore

  # Flower: monitoring UI of the queue (development), http://localhost:5555
  flower:
    build:
      context: ./services
      additional_contexts:
        pipelines: ./data
    command: ["celery", "-A", "services.celery_app", "flower", "--port=5555", "--persistent=True", "--db=/data/flower.db", "--state_save_interval=10000"]
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - healthcore

  # Ticket DEV-53: nightly telemetry job, outside the API process (see scripts/nightly_export.crontab).
  scheduler:
    build:
      context: ./services
      dockerfile: scheduler.Dockerfile
      additional_contexts:
        pipelines: ./data
        scripts: ./scripts
    init: true
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    volumes:
      # CSV backups land in the repository's data/raw (gitignored).
      - ./data/raw:/app/data/raw
    restart: unless-stopped
    networks:
      - healthcore

networks:
  healthcore:
    driver: bridge

volumes:
  tracker_node_modules:
  tracker_next:
  backoffice_node_modules:
  backoffice_next:
  api_data:
  redis_data:
  flower_data:
  qdrant_data:
